<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="version" content="v0.13.0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>熊窝</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div class="layout">
      <button class="sidebar-toggle" @click="sidebarOpen = true" v-show="!sidebarOpen" aria-label="打开侧边栏">☰</button>
      <div class="sidebar-backdrop" @click="sidebarOpen = false" v-show="sidebarOpen"></div>

      <nav class="sidebar" :class="{ open: sidebarOpen }" aria-label="主导航">
        <div class="sidebar-brand">
          <button class="sidebar-close" @click="sidebarOpen = false" aria-label="关闭侧边栏">✕</button>
          <p class="sidebar-eyebrow">Personal Home</p>
          <h1 class="sidebar-title">熊窝</h1>
        </div>
        <div class="sidebar-nav">
          <button
            v-for="tab in tabs"
            :key="tab.id"
            class="sidebar-item"
            :class="{ active: activeTab === tab.id }"
            @click="switchTab(tab.id)"
          >
            <span class="sidebar-icon">{{ tab.icon }}</span>
            <span>{{ tab.title }}</span>
          </button>
        </div>
      </nav>

      <div class="main-area" :class="{ 'lol-active': activeTab === 'lol' }">
        <main class="app-shell" :class="{ 'lol-shell': activeTab === 'lol', 'todo-shell': activeTab === 'todo' }">
          <route-table v-show="activeTab === 'routes'"></route-table>
          <valorant-view v-show="activeTab === 'valorant'"></valorant-view>
          <lol-view v-show="activeTab === 'lol'"></lol-view>
          <todo-board v-show="activeTab === 'todo'"></todo-board>
          <membership-view v-show="activeTab === 'membership'"></membership-view>
        </main>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/todo-data.js?v=0.14.0"></script>
  <script src="js/valorant-data.js"></script>
  <script src="js/lol-data.js"></script>
  <script src="js/vendor/vue.global.prod.js"></script>
  <script src="js/vendor/marked.min.js"></script>
  <script src="js/components/TodoBoard.js?v=0.13.0"></script>
  <script src="js/app.js"></script>
</body>
</html>
