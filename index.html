<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>熊窝</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div class="layout">
      <button class="sidebar-toggle" @click="sidebarOpen = true" v-show="!sidebarOpen" aria-label="打开侧边栏">☰</button>
      <div class="sidebar-backdrop" @click="sidebarOpen = false" v-show="sidebarOpen"></div>

      <nav class="sidebar" :class="{ open: sidebarOpen }" aria-label="主导航">
        <div class="sidebar-brand">
          <button class="sidebar-close" @click="sidebarOpen = false" aria-label="关闭侧边栏">✕</button>
          <p class="sidebar-eyebrow">Personal Home</p>
          <h1 class="sidebar-title">熊窝</h1>
        </div>
        <div class="sidebar-nav">
          <button
            v-for="tab in tabs"
            :key="tab.id"
            class="sidebar-item"
            :class="{ active: activeTab === tab.id }"
            @click="switchTab(tab.id)"
          >
            <span class="sidebar-icon">{{ tab.icon }}</span>
            <span>{{ tab.title }}</span>
          </button>
        </div>
      </nav>

      <div class="main-area">
        <main class="app-shell">
          <calendar-view v-if="activeTab === 'calendar'" />
          <route-table v-if="activeTab === 'routes'" />
        </main>
        <footer class="site-footer">熊窝 · 个人主页</footer>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/diary-data.js"></script>
  <script src="js/vendor/vue.global.prod.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
